<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario | SkyReservas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card auth-card--wide">

        <!-- Header -->
        <div class="auth-header">
            <div class="logo-icon">✈</div>
            <h1 class="auth-title">Crear Cuenta</h1>
            <p class="auth-subtitle">Completá tus datos para registrarte</p>
        </div>

        <!-- Mensaje de error del servidor -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Formulario de Registro -->
        <form id="registroForm" th:action="@{/registro}" method="post" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           class="form-control"
                           th:value="${nombre}"
                           placeholder="Tu nombre">
                    <span class="field-error" id="nombreError"></span>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text"
                           id="apellido"
                           name="apellido"
                           class="form-control"
                           th:value="${apellido}"
                           placeholder="Tu apellido">
                    <span class="field-error" id="apellidoError"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="correoElectronico">Correo Electrónico</label>
                <input type="email"
                       id="correoElectronico"
                       name="correoElectronico"
                       class="form-control"
                       th:value="${correoElectronico}"
                       placeholder="ejemplo@correo.com"
                       autocomplete="email">
                <span class="field-error" id="correoError"></span>
            </div>

            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       th:value="${username}"
                       placeholder="Elegí un nombre de usuario"
                       autocomplete="username">
                <span class="field-error" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Mínimo 6 caracteres"
                       autocomplete="new-password">
                <span class="field-error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Contraseña</label>
                <input type="password"
                       id="confirmarPassword"
                       name="confirmarPassword"
                       class="form-control"
                       placeholder="Repetí tu contraseña"
                       autocomplete="new-password">
                <span class="field-error" id="confirmarPasswordError"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Crear Cuenta
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tenés cuenta?
                <a th:href="@{/login}" class="link">Iniciar Sesión</a>
            </p>
        </div>

    </div>
</div>

<script th:src="@{/js/validaciones.js}"></script>
<script>
    document.getElementById('registroForm').addEventListener('submit', function(e) {
        if (!validarRegistro()) e.preventDefault();
    });
</script>
</body>
</html>
