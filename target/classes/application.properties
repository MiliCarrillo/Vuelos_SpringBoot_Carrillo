# =============================================
# CONFIGURACIÓN DE BASE DE DATOS - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_vuelos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# CONFIGURACIÓN JPA / HIBERNATE
# =============================================
# 'update' crea/actualiza tablas automáticamente. Usar 'validate' en producción.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# CONFIGURACIÓN THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =============================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================
server.port=8080

# =============================================
# INSTRUCCIONES DE SETUP:
# 1. Abrir MySQL Workbench
# 2. Ejecutar: CREATE DATABASE reserva_vuelos CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# 3. Cambiar 'tu_password_aqui' por la contraseña de tu usuario root de MySQL
# =============================================
