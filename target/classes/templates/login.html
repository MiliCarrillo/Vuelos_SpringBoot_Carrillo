<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SkyReservas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">

        <!-- Logo / Header -->
        <div class="auth-header">
            <div class="logo-icon">✈</div>
            <h1 class="auth-title">SkyReservas</h1>
            <p class="auth-subtitle">Tu portal de reservas de vuelos</p>
        </div>

        <!-- Mensaje de éxito (ej: tras registro exitoso) -->
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Formulario de Login -->
        <form id="loginForm" th:action="@{/login}" method="post" novalidate>

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       th:value="${username}"
                       placeholder="Ingresá tu usuario"
                       autocomplete="username">
                <span class="field-error" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Ingresá tu contraseña"
                       autocomplete="current-password">
                <span class="field-error" id="passwordError"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Iniciar Sesión
            </button>
        </form>

        <div class="auth-footer">
            <p>¿No tenés cuenta?
                <a th:href="@{/registro}" class="link">Crear usuario</a>
            </p>
        </div>

    </div>
</div>

<script th:src="@{/js/validaciones.js}"></script>
<script>
    // Validación del formulario de login antes de enviar
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        if (!validarLogin()) e.preventDefault();
    });
</script>
</body>
</html>
